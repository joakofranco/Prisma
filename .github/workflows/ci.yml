# =====================================================================
# CI — Lint + Tests + Build (matriz paralela por app)
# ---------------------------------------------------------------------
# Se dispara en cada push y cada PR a cualquier rama.
# Detecta cambios por path para NO reejecutar todo si sólo cambió una app.
# =====================================================================

name: CI

on:
  push:
    branches: [main, dev, 'dev/**', 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:

  # -------------------------------------------------------------------
  # 0. Detecta qué apps cambiaron para saltar jobs innecesarios
  # -------------------------------------------------------------------
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      frontend:     ${{ steps.filter.outputs.frontend }}
      backend-core: ${{ steps.filter.outputs.backend-core }}
      backend-ai:   ${{ steps.filter.outputs.backend-ai }}
      infra:        ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'infra/docker/frontend.Dockerfile'
            backend-core:
              - 'apps/backend-core/**'
              - 'infra/docker/backend-core.Dockerfile'
            backend-ai:
              - 'apps/backend-ai/**'
              - 'infra/docker/backend-ai.Dockerfile'
            infra:
              - 'infra/**'
              - 'docker-compose*.yml'
              - '.github/workflows/**'

  # -------------------------------------------------------------------
  # 1. FRONTEND — Lint + Tests + Build
  # -------------------------------------------------------------------
  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (vue-tsc)
        run: npm run type-check

      - name: Unit tests (Vitest) con cobertura
        run: npm run test:unit -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/
          retention-days: 7

      - name: Publicar cobertura al PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/frontend

  # -------------------------------------------------------------------
  # 1b. E2E + ACCESIBILIDAD (Playwright + axe-core) — WCAG 2.1 AA
  # ---------------------------------------------------------------------
  # Login real contra Keycloak + recorrido de las vistas principales + escaneo WCAG 2.1 AA
  # (nivel exigido por el Decreto N° 406/022 a los sitios del Estado uruguayo -- ver
  # apps/frontend/e2e/README.md). Levanta el subconjunto mínimo del stack que necesitan esas
  # vistas (Postgres, Redis, backend-core, Keycloak) -- se salta backend-ai/MinIO/Ollama y el
  # resto de los perfiles de observabilidad/gestión, que ninguna de las rutas cubiertas requiere.
  # -------------------------------------------------------------------
  e2e-a11y:
    name: E2E + Accesibilidad (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env para docker compose
        working-directory: .
        run: cp .env.example .env

      - name: Levantar Postgres + Redis + backend-core + Keycloak
        working-directory: .
        env:
          # El runner de GitHub Actions no tiene nginx/TLS delante: se accede a Keycloak directo
          # por localhost:8180, así que su issuer real (http://localhost:8180/auth/realms/prisma)
          # necesita sumarse a la lista de issuers en los que confía backend-core -- si no, TODAS
          # las respuestas de la API son 401 aunque el login a Keycloak haya sido válido. Ver
          # "Importante — issuer del token" en apps/frontend/e2e/README.md.
          KEYCLOAK_TRUSTED_ISSUERS: >-
            https://prisma.local/auth/realms/prisma,https://localhost/auth/realms/prisma,http://localhost:8180/auth/realms/prisma
        run: |
          docker compose --profile app --profile security up -d --build \
            postgres redis backend-core keycloak-db keycloak

      - name: Esperar a que backend-core y Keycloak respondan
        working-directory: .
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8081/actuator/health >/dev/null; do sleep 3; done'
          timeout 180 bash -c 'until curl -sf http://localhost:8180/auth/realms/prisma >/dev/null; do sleep 3; done'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Preparar .env del frontend (apuntando al stack de arriba)
        run: |
          cat > .env <<'EOF'
          VITE_API_BASE_URL=http://localhost:8081/api
          VITE_AI_API_BASE_URL=http://localhost:8000/api/v1
          VITE_KEYCLOAK_URL=http://localhost:8180/auth
          VITE_KEYCLOAK_REALM=prisma
          VITE_KEYCLOAK_CLIENT_ID=prisma-frontend
          EOF

      - name: E2E + WCAG 2.1 AA (Playwright)
        run: npx playwright test

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Logs de los servicios (si algo falló)
        if: failure()
        working-directory: .
        run: docker compose logs backend-core keycloak --tail=200

  # -------------------------------------------------------------------
  # 2. BACKEND CORE — Checkstyle + Tests JUnit + Testcontainers
  # -------------------------------------------------------------------
  backend-core:
    name: Backend Core (Spring Boot)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend-core == 'true' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/backend-core
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prisma_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Validar formato (Spotless)
        run: mvn -B spotless:check

      - name: Análisis estático (Checkstyle + SpotBugs + PMD)
        run: mvn -B verify -DskipTests -P static-analysis

      - name: Compilar
        run: mvn -B compile

      - name: Tests unitarios
        run: mvn -B test

      - name: Tests de integración (Testcontainers)
        run: mvn -B verify -P integration-tests -DfailIfNoTests=false

      - name: Reporte de cobertura (JaCoCo)
        run: mvn -B jacoco:report

      - name: Publicar reporte JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit — Backend Core
          # Sólo surefire-reports: este proyecto no usa maven-failsafe-plugin (los *IT corren
          # directo con surefire, ver pom.xml) -- target/failsafe-reports/*.xml nunca existe, y
          # dorny/test-reporter@v1 lanza un TypeError (en vez de ignorarlo) cuando uno de varios
          # globs separados por coma no matchea ningún archivo, tirando abajo todo el job pese a
          # que los tests y jacoco:check ya pasaron.
          path: apps/backend-core/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-core
          path: apps/backend-core/target/site/jacoco/

  # -------------------------------------------------------------------
  # 3. BACKEND AI — Ruff + Black + pytest
  # -------------------------------------------------------------------
  backend-ai:
    name: Backend AI (FastAPI)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend-ai == 'true' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/backend-ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check app tests

      - name: Format check (Black)
        run: black --check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Tests + cobertura (pytest)
        run: pytest --cov=app --cov-report=xml --cov-report=html --junitxml=junit.xml

      - name: Publicar reporte JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest — Backend AI
          path: apps/backend-ai/junit.xml
          reporter: java-junit

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-ai
          path: apps/backend-ai/htmlcov/

  # -------------------------------------------------------------------
  # 4. VALIDACIÓN DE INFRA (docker-compose, Dockerfiles, K8s manifests)
  # -------------------------------------------------------------------
  infra-validation:
    name: Validar infra
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: infra/docker/*.Dockerfile
          # DL3008/DL3018: no pineamos versiones de paquetes apt/apk (igual que pip/mvn acá).
          # DL3013: `pip install --upgrade pip` es intencional (siempre la última) en
          # backend-ai.Dockerfile. DL3003: el `cd` en backend-core.Dockerfile es dentro de un
          # único RUN para extraer un jar en una subshell -- un WORKDIR ahí cambiaría el
          # directorio para el resto del stage, que es justo lo que no queremos.
          ignore: DL3008,DL3018,DL3013,DL3003

      - name: Validar manifiestos Kubernetes (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          # No se puede correr kubeconform sobre los .yaml sueltos de infra/kubernetes/**:
          # kustomization.yaml no es un recurso de Kubernetes (no tiene schema) y los patches.yaml
          # de los overlays son fragmentos parciales a proposito (les faltan campos obligatorios,
          # como Deployment.spec.selector, que Kustomize completa al mergear con base/) -- siempre
          # fallaban con -strict. Se valida en cambio la salida ya renderizada de cada overlay
          # (kubectl kustomize), que es el manifiesto completo que realmente se aplicaria al cluster.
          for overlay in infra/kubernetes/overlays/*/; do
            echo "== $overlay =="
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -
          done

      - name: Lint YAML (yamllint)
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

  # -------------------------------------------------------------------
  # 5. RESUMEN FINAL (gate)
  # -------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, e2e-a11y, backend-core, backend-ai, infra-validation]
    if: always()
    steps:
      - name: Comprobar resultados
        run: |
          echo "Frontend:       ${{ needs.frontend.result }}"
          echo "E2E + a11y:     ${{ needs.e2e-a11y.result }}"
          echo "Backend Core:   ${{ needs.backend-core.result }}"
          echo "Backend AI:     ${{ needs.backend-ai.result }}"
          echo "Infra:          ${{ needs.infra-validation.result }}"
          if [[ "${{ needs.frontend.result }}"       == "failure" ]] || \
             [[ "${{ needs.e2e-a11y.result }}"       == "failure" ]] || \
             [[ "${{ needs.backend-core.result }}"   == "failure" ]] || \
             [[ "${{ needs.backend-ai.result }}"     == "failure" ]] || \
             [[ "${{ needs.infra-validation.result }}" == "failure" ]]; then
            echo "❌ CI failed"; exit 1
          fi
          echo "✅ CI passed"
