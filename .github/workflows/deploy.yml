# =====================================================================
# DEPLOY — Despliegue a los distintos entornos
# ---------------------------------------------------------------------
# Estrategia:
#   - dev:     automático al mergear a `dev`
#   - staging: manual (workflow_dispatch) o tag v*-rc*
#   - prod:    manual con doble aprobación (GitHub Environments)
# =====================================================================

name: Deploy

on:
  push:
    branches: [dev]
    tags: ['v*.*.*', 'v*-rc*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: 'Tag de la imagen a desplegar'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: read
  deployments: write
  id-token: write

jobs:

  # -------------------------------------------------------------------
  # Determinar entorno objetivo según el trigger
  # -------------------------------------------------------------------
  determine-target:
    name: Determinar destino
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      tag: ${{ steps.env.outputs.tag }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.image_tag }}"   >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v*-rc* ]]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "env=prod"    >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}"  >> "$GITHUB_OUTPUT"
          else
            echo "env=dev"     >> "$GITHUB_OUTPUT"
            echo "tag=dev"     >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------
  # Deploy — usa GitHub Environments para exigir aprobaciones
  # -------------------------------------------------------------------
  deploy:
    name: Deploy → ${{ needs.determine-target.outputs.env }}
    runs-on: ubuntu-latest
    needs: determine-target
    environment:
      name: ${{ needs.determine-target.outputs.env }}
      url:  ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      # -------- Deploy por SSH con Docker Compose (dev / staging / prod) --------
      # Cada entorno usa sus secrets: DEV_*, STAGING_* y PROD_* (HOST, USER, SSH_KEY).
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_ENV: ${{ needs.determine-target.outputs.env }}
          IMAGE_TAG: ${{ needs.determine-target.outputs.tag }}
        with:
          host: ${{ secrets[format('{0}_HOST', needs.determine-target.outputs.env)] }}
          username: ${{ secrets[format('{0}_USER', needs.determine-target.outputs.env)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', needs.determine-target.outputs.env)] }}
          envs: DEPLOY_ENV,IMAGE_TAG
          script: |
            cd /opt/prisma
            if [ "$DEPLOY_ENV" = "dev" ]; then
              git pull origin dev
              COMPOSE="docker compose"
            else
              git fetch --tags origin
              git checkout "refs/tags/$IMAGE_TAG" || true
              COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            fi
            export TAG="$IMAGE_TAG"
            $COMPOSE pull
            $COMPOSE --profile full up -d --remove-orphans
            docker system prune -f

      # -------- Smoke tests post-deploy --------
      - name: Smoke tests
        run: |
          echo "Esperando 30s a que arranque..."
          sleep 30
          curl -f "${{ vars.APP_URL }}/actuator/health" || exit 1
          echo "✅ Deploy OK"

      # -------- Notificación --------
      - name: Notificar en el resumen
        run: |
          echo "## 🚀 Deploy exitoso" >> $GITHUB_STEP_SUMMARY
          echo "- **Entorno:** ${{ needs.determine-target.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.determine-target.outputs.tag }}"     >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ vars.APP_URL }}"                            >> $GITHUB_STEP_SUMMARY
