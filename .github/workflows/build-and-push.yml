# =====================================================================
# BUILD & PUSH — Construye imágenes multi-arch y las publica en GHCR
# ---------------------------------------------------------------------
# Triggers:
#   - push a dev  → tag "dev-{sha}" + "dev"
#   - push a main → tag "main-{sha}" + "latest"
#   - tag v*      → tag semver (v1.2.3, 1.2, 1) + latest si es estable
# =====================================================================

name: Build & Push Images

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno destino'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write        # Para firma con cosign
  attestations: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend-core
            context: apps/backend-core
            dockerfile: infra/docker/backend-core.Dockerfile
          - app: backend-ai
            context: apps/backend-ai
            dockerfile: infra/docker/backend-ai.Dockerfile
          - app: frontend
            context: apps/frontend
            dockerfile: infra/docker/frontend.Dockerfile

    steps:
      - uses: actions/checkout@v4

      # ---------- RAG: knowledge base dentro del build context de backend-ai ----------
      # docs/mcu-5.0 vive fuera de apps/backend-ai/ (fuera del build context de Docker) -- se
      # copia acá antes del build para que el Dockerfile la empaquete en la imagen (ver
      # infra/docker/backend-ai.Dockerfile). Sin este paso el build igual funciona (placeholder
      # .gitkeep versionado), pero la imagen queda sin contexto para el RAG.
      - name: Sincronizar knowledge base RAG
        if: matrix.app == 'backend-ai'
        run: make sync-k8s-assets

      # ---------- Setup Buildx para multi-arch ----------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Login a GHCR ----------
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Metadata para tags y labels ----------
      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/prisma-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ---------- Build & Push ----------
      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags:  ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to:   type=gha,scope=${{ matrix.app }},mode=max
          provenance: true
          sbom: true

      # ---------- Firma de imagen con cosign (supply chain security) ----------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Firmar imagen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$TAGS" | xargs -I {} cosign sign --yes {}@$DIGEST

      # ---------- Attestation SBOM ----------
      - name: Generar SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/prisma-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json

      - name: Adjuntar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.spdx.json

  # -------------------------------------------------------------------
  # Notificación de éxito con listado de imágenes publicadas
  # -------------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    steps:
      - name: Resumen
        run: |
          echo "## 📦 Imágenes publicadas" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/prisma-frontend\`"     >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/prisma-backend-core\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/prisma-backend-ai\`"   >> $GITHUB_STEP_SUMMARY
