name: 🐛 Bug Report
description: Reportar un defecto en PRISMA
title: "[BUG] "
labels: ["type: bugfix", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Completá lo más posible; los defectos también se pueden reportar en Bugasura.

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Frontend (Vue 3)
        - Backend Core (Spring Boot)
        - Backend AI (FastAPI/RAG)
        - Base de datos
        - Infra / DevOps
        - Documentación
    validations: { required: true }

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué esperabas y qué ocurrió?
    validations: { required: true }

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Versión / Commit
      placeholder: v1.0.0 o SHA

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
    validations: { required: true }

  - type: textarea
    id: logs
    attributes:
      label: Logs / Evidencia
      render: shell
