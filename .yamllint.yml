extends: default

rules:
  line-length:
    max: 200
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
  comments:
    min-spaces-from-content: 1
  document-start: disable
  truthy:
    check-keys: false
  # Se permiten mappings/secuencias en flujo ({ key: value }, [a, b]) con relleno de un espacio.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  colons:
    max-spaces-after: -1
  commas:
    max-spaces-after: -1

ignore: |
  node_modules/
  target/
  dist/
  .github/branch-protection.yml
