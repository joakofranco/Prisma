# =====================================================================
# docker-compose.prod.yml
# ---------------------------------------------------------------------
# Overrides para PRODUCCIÓN / staging.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =====================================================================

services:

  postgres:
    restart: always
    ports: []                          # No exponer al host
    # NOTA: sin "ssl=on" -- la imagen postgres:17-alpine no trae ningún certificado en
    # /etc/ssl/certs/server.crt / /etc/ssl/private/server.key (ni los genera sola), y nada en
    # este compose los monta. Con ssl=on puesto y esos archivos ausentes, Postgres no llega a
    # arrancar ("could not load server certificate file") -- eso es lo que se veía como
    # "container prisma-postgres is unhealthy" bloqueando todo lo que depende de él (condition:
    # service_healthy). El tráfico a postgres no sale de la red interna `prisma-net` (ports: []
    # más abajo, no se expone al host) -- si en algún momento se quiere TLS acá también, hay que
    # generar y montar un certificado primero (mismo mecanismo que scripts/generate-nginx-cert.sh
    # para nginx), no alcanza con el flag solo.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "log_statement=none"
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 2G }

  redis:
    restart: always
    ports: []
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  # NOTA: En prod NO se construyen imágenes localmente. Se usan las publicadas
  # en GHCR por el workflow build-and-push.yml. Para forzarlo con docker compose,
  # invocá con `--no-build` en el comando up:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build

  backend-core:
    restart: always
    image: ghcr.io/${GHCR_ORG}/prisma-backend-core:${TAG:-latest}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: production
      LOGGING_LEVEL_ROOT: WARN
    # NOTA: sin "replicas" -- container_name (fijo en docker-compose.yml) es incompatible con
    # escalar a más de una réplica vía docker compose (Compose lo rechaza al cargar el archivo).
    # El escalado horizontal real de este servicio se hace en Kubernetes (ver
    # infra/kubernetes/overlays/prod), donde no hay ese conflicto.
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
      restart_policy:
        condition: on-failure
        max_attempts: 3

  backend-ai:
    restart: always
    image: ghcr.io/${GHCR_ORG}/prisma-backend-ai:${TAG:-latest}
    pull_policy: always
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '2.0', memory: 4G }

  frontend:
    restart: always
    image: ghcr.io/${GHCR_ORG}/prisma-frontend:${TAG:-latest}
    pull_policy: always
    ports: []                          # Sólo detrás de nginx
    # NOTA: sin "replicas" -- mismo motivo que backend-core más arriba (container_name fijo).
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # "start" (no "start-dev"): modo apto para producción -- ver infra/kubernetes/base/keycloak.yaml,
  # que usa el mismo modo por consistencia. KC_HOSTNAME_STRICT=false conserva el "hostname
  # dinámico" (docs/Certificados-TLS.md) que "start" fija a un único hostname por defecto.
  keycloak:
    restart: always
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME_STRICT: "false"
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  nginx:
    restart: always
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
