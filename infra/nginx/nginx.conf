worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    # Evidencias de hasta 100 MB (EVIDENCE_MAX_SIZE). Un poco más alto que el límite de la aplicación
    # (RF-EVI-04) a propósito: así el rechazo de un archivo grande lo da backend-core con su mensaje
    # y no Nginx con una página 413. Si se sube EVIDENCE_MAX_SIZE por encima de 105 MB, subir también
    # este valor y el de apps/frontend/nginx.conf.
    client_max_body_size 105m;

    # ---- Rate limiting global ----
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    # RNF-07: 5 intentos de login por minuto por IP. Zona aparte (no la de "api" arriba, que es
    # 30r/s = 1800r/m) aplicada solo al endpoint donde Keycloak recibe credenciales
    # (login-actions/authenticate, ver prisma-locations.inc) -- el endpoint de token
    # (protocol/openid-connect/token) NO se limita acá porque también lo usa el refresh
    # silencioso de sesión (startTokenRefresh en el frontend), que no es un intento de login.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

    # ---- Compresión ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
