# =====================================================================
# prisma.conf — Virtual host principal (reverse proxy)
# =====================================================================

upstream backend_core { server backend-core:8080; keepalive 32; }
upstream backend_ai   { server backend-ai:8000;   keepalive 16; }
upstream frontend_svc { server frontend:80;       keepalive 32; }
upstream keycloak_svc { server keycloak:8080;     keepalive 16; }

# ---------- HTTP ----------
# Sirve la app tal cual, SIN redirigir a HTTPS: HTTP y HTTPS son ambas formas soportadas de
# acceder a PRISMA (a pedido explícito -- antes acá había un 301 a https://$host$request_uri).
# Las locations están en prisma-locations.inc, compartidas con el server de :443 de abajo, que
# arma X-Forwarded-Proto con $scheme -- así backend-core/Keycloak ven el protocolo real de cada
# request en vez de asumir https siempre. Ver KEYCLOAK_TRUSTED_ISSUERS en .env.example: por cada
# host soportado tiene que estar tanto la variante http:// como la https://, si no el login entra
# pero las llamadas a la API dan 401.
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/prisma-locations.inc;
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2 default_server;
    # default_server ya matchea cualquier Host no listado acá (incluido localhost) -- se listan
    # los dos explícitamente sólo para que quede documentado que ambos son de uso soportado (ver
    # docs/Certificados-TLS.md: Keycloak usa hostname dinámico, así que el login funciona por
    # cualquiera de los dos sin configuración extra).
    server_name prisma.local localhost;

    ssl_certificate     /etc/nginx/certs/prisma.crt;
    ssl_certificate_key /etc/nginx/certs/prisma.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Sólo tiene sentido sobre TLS -- un navegador ignora este header si llega por HTTP plano, así
    # que se queda acá y no en prisma-locations.inc (compartido con el server de :80).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/prisma-locations.inc;
}
