# Solo se monta en producción con Cloudflare Tunnel (docker-compose.cloudflare.yml).
# cloudflared corre en el host y entra por el puerto publicado: NGINX ve su conexión desde la puerta
# de enlace de prisma-net (172.28.0.1), o desde la IP de la VPN del propio host (10.8.0.1) cuando el
# túnel entra por esa IP. Solo desde esos dos orígenes se toma la IP del visitante de
# CF-Connecting-IP; desde cualquier otro origen la cabecera se ignora.
set_real_ip_from 172.28.0.1;
set_real_ip_from 10.8.0.1;
real_ip_header   CF-Connecting-IP;
real_ip_recursive off;
