# PRODUCCION (PRI-369): el contenedor frontend sirve HTTPS en el 8443 con el certificado emitido por
# scripts/generate-internal-ca.sh (montado en /etc/prisma/tls). Reemplaza apps/frontend/nginx-listen.conf.
listen 8443 ssl;
listen [::]:8443 ssl;
ssl_certificate     /etc/prisma/tls/frontend.crt;
ssl_certificate_key /etc/prisma/tls/frontend.key;
ssl_protocols       TLSv1.2 TLSv1.3;
