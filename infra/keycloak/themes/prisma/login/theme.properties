## Tema de login de PRISMA. Hereda del tema base de Keycloak 26 (keycloak.v2) y lo reemplaza
## visualmente: layout en dos paneles (marca + tarjeta), claro/oscuro, pantallas de login y de
## "¿Olvidaste tu contraseña?" (template.ftl, login.ftl, login-reset-password.ftl, resources/).
## El tema claro/oscuro se toma de localStorage "prisma:theme" (el mismo origen que la app detrás
## de nginx) y, si no existe, de prefers-color-scheme.
## Los textos están en messages/. Además el error de usuario/contraseña explica la política de
## bloqueo: Keycloak no avisa que una cuenta está bloqueada (es por diseño, para que nadie pueda
## averiguar qué cuentas existen), así que el mismo error genérico la explica sin revelar nada.
parent=keycloak.v2
styles=css/styles.css css/prisma.css
locales=es,en
