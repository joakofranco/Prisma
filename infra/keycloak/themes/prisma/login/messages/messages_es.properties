# Textos del tema de login de PRISMA (español rioplatense). El realm debe tener el español
# habilitado (internationalizationEnabled=true, supportedLocales=["es"], defaultLocale="es"):
# está en infra/keycloak/realm-prisma.json y lo aplica scripts/keycloak/apply-auth-policy.sh.
#
# Los números del error de login (10 intentos, 15 minutos) son los del realm: failureFactor y
# waitIncrementSeconds (infra/keycloak/realm-prisma.json, scripts/keycloak/apply-auth-policy.sh).
# Si se cambian allá, cambiarlos acá y en messages_en.properties.
