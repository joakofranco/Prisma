# Error de login. Keycloak muestra EL MISMO texto si la contraseña es incorrecta, si el usuario no
# existe y si la cuenta está bloqueada temporalmente (no revela cuál de las tres es). Por eso el
# texto explica la política de bloqueo.
# Los números (10 intentos, 15 minutos) son los del realm: failureFactor y waitIncrementSeconds
# (infra/keycloak/realm-prisma.json, scripts/keycloak/apply-auth-policy.sh). Si se cambian allá,
# cambiarlos acá y en messages_es.properties.
invalidUserMessage=Invalid username or password. After 10 failed attempts in a row the account is locked for 15 minutes.
accountTemporarilyDisabledMessage=Invalid username or password. After 10 failed attempts in a row the account is locked for 15 minutes.
