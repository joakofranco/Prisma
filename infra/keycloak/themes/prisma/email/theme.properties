## PRI-366: theme de email custom con la identidad visual de PRISMA (banda azul #2563eb +
## wordmark "PRISMA", el mismo tratamiento que usa el header real de la app -- ver
## apps/frontend/src/components/layout/AppHeader.vue). No hay un logo rasterizado en el
## repo (el "logo" actual de la app es un icono + texto, no una imagen), así que el header
## del correo reproduce ese mismo tratamiento en vez de inventar un logo que no existe.
##
## parent=keycloak: hereda todos los mensajes/asuntos y las plantillas de contenido
## (password-reset.ftl, email-verification.ftl, etc.) del theme base -- solo se sobrescribe
## html/template.ftl, el wrapper que envuelve TODOS los correos (incluido "¿Olvidaste tu
## contraseña?"), así que alcanza con un solo archivo para que todos los correos de Keycloak
## queden con la identidad visual de PRISMA.
parent=keycloak
