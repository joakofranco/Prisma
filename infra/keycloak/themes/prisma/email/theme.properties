## PRI-366: theme de email custom con la identidad visual de PRISMA (logo real embebido en
## base64 -- ver html/template.ftl -- más banda azul #2563eb, consistente con el header real de
## la app, apps/frontend/src/components/layout/AppHeader.vue).
##
## parent=keycloak: hereda todos los mensajes/asuntos y las plantillas de contenido
## (password-reset.ftl, email-verification.ftl, etc.) del theme base -- solo se sobrescribe
## html/template.ftl, el wrapper que envuelve TODOS los correos (incluido "¿Olvidaste tu
## contraseña?"), así que alcanza con un solo archivo para que todos los correos de Keycloak
## queden con la identidad visual de PRISMA.
##
## PRI-240: excepción, la invitación a evaluadores internos. html/ y text/executeActions.ftl
## reemplazan el contenido en inglés del tema base y messages/ pisa solo su asunto.
##
## El correo de "Probar conexión" (Configuración → Correo electrónico) también se pisa, pero solo
## el texto: messages/messages_es.properties define emailTestSubject/emailTestBody(Html), el
## locale que de verdad sirve el realm (supportedLocales=[es] en realm-prisma.json).
parent=keycloak
