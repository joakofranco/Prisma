# El realm "prisma" tiene internacionalización habilitada con supportedLocales=[es] y
# defaultLocale=es (ver infra/keycloak/realm-prisma.json), así que este archivo es el que
# Keycloak sirve de verdad -- messages_en.properties queda sin usarse mientras el realm no
# soporte otro locale además de "es".
#
# PRI-240: mismo asunto que messages_en.properties, por si en algún momento se agrega otro locale.
executeActionsSubject=Te invitaron a PRISMA: creá tu contraseña

# Correo de "Probar conexión" en Configuración → Correo electrónico. Pisa el texto genérico del
# tema base ("[KeyCloak] - Mensaje de prueba SMTP" / "Este es un mensaje de prueba"): no menciona
# a Keycloak (es un detalle de implementación que no le compete al administrador que lo lee) y
# confirma para qué sirve, no solo que "es una prueba".
emailTestSubject=PRISMA · Prueba de configuración de correo
emailTestBody=Este correo confirma que el servidor SMTP de PRISMA está configurado correctamente.\n\nSi lo recibiste, las notificaciones de la plataforma (recuperación de contraseña, alertas del sistema y demás avisos) se van a entregar sin problemas.
emailTestBodyHtml=<p style="margin:0 0 12px;">Este correo confirma que el servidor SMTP de <strong>PRISMA</strong> está configurado correctamente.</p><p style="margin:0;">Si lo recibiste, las notificaciones de la plataforma (recuperación de contraseña, alertas del sistema y demás avisos) se van a entregar sin problemas.</p>
