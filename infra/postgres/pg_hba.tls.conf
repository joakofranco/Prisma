# =====================================================================
# pg_hba.tls.conf — Postgres en PRODUCCION: solo TLS para conexiones por red (PRI-369)
# ---------------------------------------------------------------------
# Se monta en /etc/prisma/pg_hba.conf y se activa con "-c hba_file=..." (ver docker-compose.prod.yml).
# Replica el pg_hba por defecto de la imagen (socket y loopback sin password) pero reemplaza la
# regla "host ... scram-sha-256" (acepta TLS o texto plano) por "hostssl": una conexion por red SIN
# TLS no matchea ninguna regla y Postgres la rechaza.
# =====================================================================
# TYPE     DATABASE  USER  ADDRESS        METHOD
local      all       all                  trust
host       all       all   127.0.0.1/32   trust
host       all       all   ::1/128        trust
local      replication all                trust
hostssl    all       all   all            scram-sha-256
