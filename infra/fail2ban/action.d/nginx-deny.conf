[Definition]
actionstart = : > /banlist/f2b.conf
actionstop =
actioncheck = test -f /banlist/f2b.conf
actionban = echo "deny <ip>;" >> /banlist/f2b.conf
            /usr/local/bin/nginx-reload.sh
actionunban = sed -i "\|^deny <ip>;$|d" /banlist/f2b.conf
              /usr/local/bin/nginx-reload.sh

[Init]
