# Strategic-merge simple -- acá sí es seguro (ConfigMap.data mergea clave por clave, a
# diferencia de spec.rules del Ingress). Depende del host de este ambiente (ver ingress-patch.yaml).
apiVersion: v1
kind: ConfigMap
metadata: { name: prisma-config }
data:
  KEYCLOAK_ISSUER_URL: "https://dev.prisma.example.uy/auth"
  KEYCLOAK_TRUSTED_ISSUERS: "https://dev.prisma.example.uy/auth/realms/prisma"
  CORS_ALLOWED_ORIGINS: "https://dev.prisma.example.uy"
