apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prisma-dev
namePrefix: ""
commonLabels:
  environment: dev

resources:
  - ../../base

# NOTA: antes de este fix, "patches.yaml" existía en el repo pero nunca se aplicaba -- faltaba
# este campo "patches:" (Kustomize no auto-descubre patches.yaml, hay que referenciarlo).
patches:
  - path: patches.yaml
  - target: { kind: Ingress, name: prisma-ingress }
    path: ingress-patch.yaml
  - path: configmap-patch.yaml

images:
  - name: ghcr.io/prisma/prisma-frontend
    newTag: dev
  - name: ghcr.io/prisma/prisma-backend-core
    newTag: dev
  - name: ghcr.io/prisma/prisma-backend-ai
    newTag: dev
