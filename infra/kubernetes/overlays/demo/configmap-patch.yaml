# Strategic-merge simple -- ConfigMap.data mergea clave por clave. La demo se abre con
# `kubectl port-forward svc/frontend 8888:80 -n prisma-demo` (ver docs/Demo-Kubernetes-MVP.md):
# una URL fija y predecible para grabar, sin depender de la IP de minikube ni de un Ingress. El
# frontend sirve /auth, /api, /ai same-origin (ver apps/frontend/nginx.conf), así que Keycloak
# necesita conocer ESTE origen como issuer real para que el login funcione.
#
# Puerto 8888, NO 8080: el "frontend" de docker-compose.yml ya usa 8080 por defecto
# (FRONTEND_PORT) -- con ambos stacks corriendo a la vez en la misma máquina (algo común
# mientras se prueba esta demo), 8080 queda ambiguo entre docker-compose y este port-forward.
# Además, en Windows con WSL2, otro proceso escuchando en el loopback IPv6 (::1) de un puerto
# ocupado puede "ganarle" al port-forward (que sólo escucha en 127.0.0.1) cuando el navegador
# resuelve "localhost" a IPv6 primero -- un puerto propio y poco común evita el problema entero.
apiVersion: v1
kind: ConfigMap
metadata: { name: prisma-config }
data:
  KEYCLOAK_ISSUER_URL: "http://localhost:8888/auth"
  KEYCLOAK_TRUSTED_ISSUERS: "http://localhost:8888/auth/realms/prisma"
  CORS_ALLOWED_ORIGINS: "http://localhost:8888"
