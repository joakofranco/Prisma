# Mismo criterio que overlays/dev/patches.yaml: bajar CPU/RAM por pod, no la redundancia
# (backend-core y frontend heredan sus 2 réplicas de la base) -- la demo sigue
# mostrando self-healing y rolling update sin quedar reducida a un solo pod por servicio, pero
# el total entra cómodo en un minikube chico (ver dimensionamiento en
# docs/Demo-Kubernetes-MVP.md). `imagePullPolicy: Never` en las 2 imágenes propias que corren acá (frontend y backend-core): se
# construyen en el host y se cargan a minikube (`make k8s-demo-images`), nunca se publican a
# GHCR para esta demo -- con la política por defecto (Always en backend-core, ver
# base/backend-core.yaml) el kubelet intentaría bajarlas de ghcr.io e ignoraría la imagen local.
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend-core }
spec:
  template:
    spec:
      containers:
        - name: backend-core
          imagePullPolicy: Never
          # Memoria: la JVM de backend-core llega a ~1 Gi durante el arranque (Flyway + Hibernate)
          # y se estabiliza en ~750 Mi. Con limit 1Gi el pod moría por OOMKilled en bucle. Se
          # dejan 1Gi de request / 2Gi de limit (igual que la base): baja CPU, no memoria.
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          # Arranque lento en minikube (CPU compartida con el resto del stack): 60 x 5s = 5 min
          # antes de que el kubelet lo mate, en vez de los 2,5 min de la base.
          startupProbe:
            failureThreshold: 60
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: keycloak-db }
spec:
  template:
    spec:
      containers:
        - name: keycloak-db
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
# base/keycloak.yaml apunta las probes al management port (9000) /health/ready y /health/live --
# el propio comentario de ese archivo (y infra/kubernetes/README.md, sección "Keycloak — caveats
# operativos") avisa que ese path NUNCA se confirmó levantando el contenedor contra la 26.7. Para
# NO dejar la grabación del video a merced de ese path sin verificar, esta demo cambia a un
# probe TCP simple sobre el puerto http (8080): confirma que Keycloak está aceptando conexiones,
# que alcanza para el guion de la demo. Si se resuelve el punto 2 de la deuda técnica (ver
# docs/mcu-5.0/Kubernetes-Analisis-Viabilidad.md, sección 2.5), este patch deja de hacer falta.
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak }
spec:
  template:
    spec:
      containers:
        - name: keycloak
          # httpGet: null es necesario -- un patch strategic-merge normal MERGEA los campos del
          # Probe en vez de reemplazarlo entero (httpGet/tcpSocket/exec no son mutuamente
          # excluyentes para Kustomize), así que sin esto quedan httpGet Y tcpSocket seteados a
          # la vez y la API de Kubernetes rechaza el Pod (un Probe admite un solo handler).
          readinessProbe:
            httpGet: null
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: null
            tcpSocket: { port: http }
            periodSeconds: 30
---
# Tope más bajo que la base (2→8): en un minikube de 4 vCPU, 8 réplicas de backend-core nunca
# entrarían a la vez. 2→4 alcanza para que un scale-up sea visible y programable en el video.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-core-hpa }
spec:
  maxReplicas: 4
  # Sólo CPU (la base escala también por memoria al 80%): la memoria de una JVM es un mal
  # disparador -- sube en el arranque y se queda alta -- y hacía que el HPA subiera a 4 réplicas
  # apenas arrancaba la demo, causando más arranques simultáneos y reinicios. `metrics` es una
  # lista atómica: este valor REEMPLAZA a la de la base. El escalado de la demo 3 se hace a mano.
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
