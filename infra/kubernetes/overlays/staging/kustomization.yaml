apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prisma-staging
namePrefix: ""
commonLabels:
  environment: staging

resources:
  - ../../base

patches:
  - target: { kind: Ingress, name: prisma-ingress }
    path: ingress-patch.yaml
  - path: configmap-patch.yaml

images:
  - name: ghcr.io/prisma/prisma-frontend
    newTag: staging
  - name: ghcr.io/prisma/prisma-backend-core
    newTag: staging
  - name: ghcr.io/prisma/prisma-backend-ai
    newTag: staging
