apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: [redis-server, --requirepass, "$(REDIS_PASSWORD)"]
          env:
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: SPRING_DATA_REDIS_PASSWORD } } }
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  ports: [{ port: 6379 }]
  selector: { app.kubernetes.io/name: redis }
