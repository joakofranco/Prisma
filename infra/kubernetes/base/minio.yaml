apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: [minio, server, /data, --console-address, ":9001"]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: prisma-secrets, key: MINIO_ACCESS_KEY } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: MINIO_SECRET_KEY } } }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
# Consola (9001) sólo por Service interno -- no se expone por Ingress (ver ingress.yaml). Para
# administrar a mano: `kubectl port-forward svc/minio 9001:9001`.
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  ports:
    - { port: 9000, targetPort: api, name: api }
    - { port: 9001, targetPort: console, name: console }
  selector: { app.kubernetes.io/name: minio }
