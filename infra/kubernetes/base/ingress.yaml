apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prisma-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [prisma.example.uy]
      secretName: prisma-tls
  rules:
    - host: prisma.example.uy
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend-core, port: { number: 8080 } } }
          - path: /ai
            pathType: Prefix
            backend: { service: { name: backend-ai, port: { number: 8000 } } }
          # Obligatoria, no opcional: el login de Keycloak es una redirección del NAVEGADOR
          # (no un proxy interno) -- sin esta ruta, el login rompe apenas exista Keycloak en
          # el cluster (ver keycloak.yaml).
          - path: /auth
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
