# =====================================================================
# secret.example.yaml — plantilla del Secret real de cada namespace.
# ---------------------------------------------------------------------
# Este archivo NO está en `resources:` de ningún kustomization.yaml -- kubectl apply -k . nunca
# lo toca. El Secret real ("prisma-secrets") se crea A MANO, una sola vez por namespace, ANTES
# del primer `kubectl apply -k .` -- ver "Primer deploy en un namespace nuevo" en
# infra/kubernetes/README.md. Así, una corrección posterior con `kubectl edit secret` sobrevive
# a los deploys de CI (que sólo tocan lo que está en resources:).
#
# Ejemplo de creación (reemplazar cada CHANGE_ME por un valor real, ej. `openssl rand -base64 32`):
#
#   kubectl create secret generic prisma-secrets -n prisma-<env> \
#     --from-literal=SPRING_DATASOURCE_USERNAME=prisma \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=CHANGE_ME \
#     --from-literal=SPRING_DATA_REDIS_PASSWORD=CHANGE_ME \
#     --from-literal=JWT_SECRET=CHANGE_ME_AT_LEAST_256_BITS_LONG \
#     --from-literal=MINIO_ACCESS_KEY=CHANGE_ME \
#     --from-literal=MINIO_SECRET_KEY=CHANGE_ME \
#     --from-literal=KEYCLOAK_DB_PASSWORD=CHANGE_ME \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD=CHANGE_ME \
#     --from-literal=KEYCLOAK_ADMIN_CLIENT_SECRET=CHANGE_ME \
#     --from-literal=AI_INTERNAL_API_KEY=CHANGE_ME
#
# O aplicando este mismo archivo con los valores ya editados (nunca commitear esa versión --
# ver .gitignore: infra/kubernetes/**/secret.*.yaml está ignorado salvo este .example.yaml):
#
#   kubectl apply -f secret.example.yaml -n prisma-<env>
# =====================================================================
apiVersion: v1
kind: Secret
metadata: { name: prisma-secrets }
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: prisma
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  SPRING_DATA_REDIS_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_AT_LEAST_256_BITS_LONG_ABCDEFGHIJKLMNOPQRSTUVWXYZ1234
  MINIO_ACCESS_KEY: CHANGE_ME
  MINIO_SECRET_KEY: CHANGE_ME
  KEYCLOAK_DB_PASSWORD: CHANGE_ME
  KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME
  # Debe coincidir con el secret del client "prisma-backend" en Keycloak (Admin Console --
  # infra/keycloak/realm-prisma.json lo importa con el valor CHANGE_ME_IN_PRODUCTION la
  # primera vez; rotarlo ahí y acá por igual, ver infra/kubernetes/README.md).
  KEYCLOAK_ADMIN_CLIENT_SECRET: CHANGE_ME
  # Compartida entre backend-core y backend-ai (header X-Internal-Api-Key) -- backend-ai la lee
  # como INTERNAL_API_KEY (ver backend-ai.yaml), mismo valor, nombre de variable distinto.
  AI_INTERNAL_API_KEY: CHANGE_ME
