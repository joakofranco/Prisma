apiVersion: apps/v1
kind: StatefulSet
metadata: { name: keycloak-db }
spec:
  serviceName: keycloak-db
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak-db } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak-db } }
    spec:
      containers:
        - name: keycloak-db
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: keycloak }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: prisma-config, key: KEYCLOAK_DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: KEYCLOAK_DB_PASSWORD } } }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: [pg_isready, -U, keycloak] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak-db }
spec:
  clusterIP: None
  ports: [{ port: 5432 }]
  selector: { app.kubernetes.io/name: keycloak-db }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7
          # "start" (no "start-dev"): modo apto para producción -- docker-compose.prod.yml usa el
          # mismo modo por consistencia. KC_HOSTNAME_STRICT=false conserva el "hostname dinámico"
          # (arma cada URL a partir del Host real de cada request, ver docs/Certificados-TLS.md)
          # que "start" fija a un único hostname por defecto.
          args: ["start", "--import-realm"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://keycloak-db:5432/keycloak" }
            - { name: KC_DB_USERNAME, valueFrom: { configMapKeyRef: { name: prisma-config, key: KEYCLOAK_DB_USER } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: KEYCLOAK_DB_PASSWORD } } }
            - { name: KEYCLOAK_ADMIN, valueFrom: { configMapKeyRef: { name: prisma-config, key: KEYCLOAK_ADMIN } } }
            - { name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: KEYCLOAK_ADMIN_PASSWORD } } }
            - { name: KC_HTTP_RELATIVE_PATH, value: /auth }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9000, name: management }
          # Puerto de management (9000), no 8080/auth -- Keycloak 24+ expone /health/ready y
          # /health/live ahí. A CONFIRMAR contra 26.7 en el primer deploy real (ver
          # infra/kubernetes/README.md) -- no se pudo levantar el contenedor en este entorno
          # para verificar el path exacto.
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm-import
          configMap: { name: keycloak-realm-config }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak }
spec:
  ports:
    - { port: 8080, targetPort: http, name: http }
    - { port: 9000, targetPort: management, name: management }
  selector: { app.kubernetes.io/name: keycloak }
