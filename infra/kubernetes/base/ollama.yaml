apiVersion: apps/v1
kind: StatefulSet
metadata: { name: ollama }
spec:
  serviceName: ollama
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ollama } }
  template:
    metadata: { labels: { app.kubernetes.io/name: ollama } }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{ containerPort: 11434 }]
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
          resources:
            requests: { cpu: "2", memory: "8Gi" }
            limits:   { cpu: "4", memory: "16Gi" }
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 30Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: ollama }
spec:
  ports: [{ port: 11434 }]
  selector: { app.kubernetes.io/name: ollama }
