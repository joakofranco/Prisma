apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-core
  labels:
    app.kubernetes.io/name: backend-core
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: backend-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend-core }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000
      containers:
        - name: backend-core
          image: ghcr.io/prisma/prisma-backend-core:latest    # kustomize edit set image lo sobrescribe
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: { name: prisma-config }
            - secretRef:    { name: prisma-secrets }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "2Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp,     mountPath: /tmp }
            - { name: evidences, mountPath: /var/prisma/evidences }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: evidences
          persistentVolumeClaim:
            claimName: evidences-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-core
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: backend-core
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-core-hpa }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-core
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend-core-pdb }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend-core }
