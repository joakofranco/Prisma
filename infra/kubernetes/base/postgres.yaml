apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: prisma-secrets }
          env:
            - { name: POSTGRES_DB, value: prisma }
            - { name: POSTGRES_USER, value: prisma }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: prisma-secrets, key: SPRING_DATASOURCE_PASSWORD } } }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            # Igual que docker-compose.yml: crea los schemas prisma/audit (Flyway los necesita)
            # sólo en el primer arranque sobre un volumen vacío.
            - { name: init-sql, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec: { command: [pg_isready, -U, prisma] }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
      volumes:
        - name: init-sql
          configMap: { name: postgres-init-config }
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  clusterIP: None
  ports: [{ port: 5432 }]
  selector: { app.kubernetes.io/name: postgres }
