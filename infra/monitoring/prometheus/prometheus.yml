global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: prisma-local
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:

  # ---------- Prometheus autoscrape ----------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ---------- Backend Core (Spring Boot Actuator) ----------
  - job_name: backend-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-core:8080']

  # ---------- Backend AI (FastAPI + prometheus_client) ----------
  - job_name: backend-ai
    metrics_path: /metrics
    static_configs:
      - targets: ['backend-ai:8000']

  # ---------- Node exporter (métricas del host) ----------
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # ---------- cAdvisor (métricas de contenedores) ----------
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # ---------- PostgreSQL exporter ----------
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ---------- Redis exporter ----------
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
