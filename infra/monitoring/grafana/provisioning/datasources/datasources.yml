apiVersion: 1

datasources:
  # Los dashboards provisionados en grafana/dashboards/*.json referencian estos datasources
  # por nombre (ej. "Prometheus"), así que si se renombran acá hay que actualizarlos ahí
  # también. No se les asigna un uid explícito a propósito: en la imagen grafana/grafana:latest
  # usada acá, agregar "uid:" en este YAML hace crashear el contenedor en loop durante el
  # provisioning ("Datasource provisioning error: data source not found"), reproducible con
  # cualquier valor de uid — probablemente un bug de esa versión. Sin uid, todo funciona bien.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: prisma
    user: prisma
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
