server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------- Logs de contenedores Docker ----------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=prisma"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label:  'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label:  'stream'

    # Métricas derivadas del access.log de NGINX (DoS y fuerza bruta): Promtail las expone en
    # :9080/metrics como promtail_custom_* y Prometheus las lee (job "promtail"). Ver
    # prometheus/rules/security.yml.
    pipeline_stages:
      - match:
          selector: '{container="/prisma-nginx"}'
          stages:
            - regex:
                expression: '^\S+ \S+ \S+ \[[^\]]+\] "(?P<method>\S+) (?P<path>\S+) [^"]*" (?P<status>\d{3}) '
            - labels:
                status:
            - metrics:
                nginx_requests_total:
                  type: Counter
                  description: "Peticiones atendidas por NGINX"
                  max_idle_duration: 24h
                  config:
                    match_all: true
                    action: inc
            - match:
                selector: '{container="/prisma-nginx", status="429"}'
                stages:
                  - metrics:
                      nginx_rate_limited_total:
                        type: Counter
                        description: "Peticiones rechazadas por el límite de tasa de NGINX (429)"
                        max_idle_duration: 24h
                        config:
                          match_all: true
                          action: inc
            - match:
                selector: '{container="/prisma-nginx", status="429"} |~ "login-actions/authenticate"'
                stages:
                  - metrics:
                      nginx_auth_login_rate_limited_total:
                        type: Counter
                        description: "Intentos de login rechazados por el límite de tasa (429)"
                        max_idle_duration: 24h
                        config:
                          match_all: true
                          action: inc
