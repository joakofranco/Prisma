x-rolling: &rolling
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    monitor: 30s
    delay: 10s
  rollback_config:
    parallelism: 1
    order: start-first
  restart_policy:
    condition: any
    delay: 10s

x-single: &single
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    parallelism: 1
    order: stop-first
  restart_policy:
    condition: any
    delay: 10s

networks:
  prisma-net:
    driver: overlay
    attachable: true
    name: ${NETWORK_NAME:-prisma-net}

volumes:
  postgres-data:      { name: "${VOLUME_PREFIX:-prisma}-postgres-data" }
  redis-data:         { name: "${VOLUME_PREFIX:-prisma}-redis-data" }
  rustfs-data:        { name: "${VOLUME_PREFIX:-prisma}-rustfs-data" }
  ollama-data:        { name: "${VOLUME_PREFIX:-prisma}-ollama-data" }
  chroma-data:        { name: "${VOLUME_PREFIX:-prisma}-chroma-data" }
  keycloak-db-data:   { name: "${VOLUME_PREFIX:-prisma}-keycloak-db-data" }
  alertmanager-config: { name: "${VOLUME_PREFIX:-prisma}-alertmanager-config" }
  evidences-data:     { name: "${VOLUME_PREFIX:-prisma}-evidences-data" }
  clamav-data:        { name: "${VOLUME_PREFIX:-prisma}-clamav-data" }
  nginx-f2b-logs:     { name: "${VOLUME_PREFIX:-prisma}-nginx-f2b-logs" }
  nginx-banlist:      { name: "${VOLUME_PREFIX:-prisma}-nginx-banlist" }
  fail2ban-data:      { name: "${VOLUME_PREFIX:-prisma}-fail2ban-data" }

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    command:
      - sh
      - -c
      - >-
        install -m 600 -o postgres -g postgres /etc/prisma/tls/server.key.src /var/lib/postgresql/server.key &&
        exec docker-entrypoint.sh postgres
        -c max_connections=200 -c shared_buffers=1GB -c log_statement=none
        -c ssl=on -c ssl_cert_file=/etc/prisma/tls/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2 -c hba_file=/etc/prisma/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./infra/tls/postgres.crt:/etc/prisma/tls/server.crt:ro
      - ./infra/tls/postgres.key:/etc/prisma/tls/server.key.src:ro
      - ./infra/postgres/pg_hba.tls.conf:/etc/prisma/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.data == true]
      resources:
        limits: { cpus: '2.0', memory: 4G }
        reservations: { cpus: '1.0', memory: 2G }

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.data == true]
      resources:
        limits: { cpus: '1.0', memory: 1G }

  backend-core:
    image: ghcr.io/${GHCR_ORG}/prisma-backend-core:${TAG}
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: production
      LOGGING_LEVEL_ROOT: WARN
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/prisma/tls/ca.crt
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /etc/prisma/tls/backend-core.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /etc/prisma/tls/backend-core.key
      KEYCLOAK_AUTH_SERVER_URL: https://keycloak:8443
      # URL pública de la app para las invitaciones por correo (PRI-379), ver .env.example.
      PRISMA_APP_URL: ${PRISMA_APP_URL:-https://prisma.local}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-https://prisma.local/auth}
      KEYCLOAK_TRUSTED_ISSUERS: ${KEYCLOAK_TRUSTED_ISSUERS:-https://prisma.local/auth/realms/prisma,https://localhost/auth/realms/prisma}
      KEYCLOAK_REALM: prisma
      KEYCLOAK_RESOURCE: prisma-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      S3_ENDPOINT: https://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://prisma.local:9001}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET_EVIDENCES}
      EVIDENCE_ALLOWED_EXTENSIONS: ${EVIDENCE_ALLOWED_EXTENSIONS:-pdf,zip,docx,txt,md,markdown,png,jpg,jpeg}
      EVIDENCE_MAX_SIZE: ${EVIDENCE_MAX_SIZE:-100MB}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      AI_SERVICE_URL: https://backend-ai:8000
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-3s}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-60s}
      # 300 s: con 2 guías en paralelo varias pasan de 120 s y se cortaban.
      AI_GUIDE_READ_TIMEOUT: ${AI_GUIDE_READ_TIMEOUT:-300s}
      # Cola de trabajos de IA (ver AiJobProperties). Opcionales; estos son los valores por defecto.
      AI_JOBS_ENABLED: ${AI_JOBS_ENABLED:-true}
      AI_JOBS_CONCURRENCY: ${AI_JOBS_CONCURRENCY:-2}
      AI_JOBS_MAX_PENDING_PER_ORG: ${AI_JOBS_MAX_PENDING_PER_ORG:-20}
      AI_JOBS_MAX_BATCH_SIZE: ${AI_JOBS_MAX_BATCH_SIZE:-20}
      AI_JOBS_MAX_PENDING_BATCH_PER_ORG: ${AI_JOBS_MAX_PENDING_BATCH_PER_ORG:-60}
      AI_JOBS_RESULT_TTL_DAYS: ${AI_JOBS_RESULT_TTL_DAYS:-30}
      AI_JOBS_MAX_ATTEMPTS: ${AI_JOBS_MAX_ATTEMPTS:-2}
      AI_JOBS_RETRY_BACKOFF_SECONDS: ${AI_JOBS_RETRY_BACKOFF_SECONDS:-30}
      AI_JOBS_POLL_INTERVAL_MS: ${AI_JOBS_POLL_INTERVAL_MS:-2000}
      AI_GUIDE_FEEDBACK_DAYS: ${AI_GUIDE_FEEDBACK_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://prisma.local,https://localhost}
      JAVA_TOOL_OPTIONS: ${BACKEND_CORE_JVM_OPTS:--Xms512m -Xmx1024m}
      TZ: ${TZ}
    command:
      - sh
      - -c
      - >-
        cp "$$JAVA_HOME/lib/security/cacerts" /tmp/truststore.jks &&
        keytool -importcert -noprompt -alias prisma-internal-ca -file /etc/prisma/tls/ca.crt
        -keystore /tmp/truststore.jks -storepass changeit &&
        exec java -Djavax.net.ssl.trustStore=/tmp/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
        -cp "/app:/app/lib/*" uy.edu.prisma.PrismaApplication
    volumes:
      - evidences-data:/var/prisma/evidences
      - alertmanager-config:/var/prisma/alerting
      - ./infra/tls/ca.crt:/etc/prisma/tls/ca.crt:ro
      - ./infra/tls/backend-core.crt:/etc/prisma/tls/backend-core.crt:ro
      - ./infra/tls/backend-core.key:/etc/prisma/tls/backend-core.key:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/etc/prisma/tls/ca.crt", "https://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [prisma-net]
    deploy:
      <<: *rolling
      replicas: ${BACKEND_CORE_REPLICAS:-2}
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: { cpus: '2.0', memory: 2G }

  backend-ai:
    image: ghcr.io/${GHCR_ORG}/prisma-backend-ai:${TAG}
    environment:
      APP_ENV: production
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      # Cambiar el embedding exige REINDEXAR todas las colecciones (cambian las dimensiones).
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Opciones enviadas a Ollama en cada pedido (ver app/rag/ollama_runtime.py). AI_NUM_CTX y
      # AI_KEEP_ALIVE deben coincidir con OLLAMA_CONTEXT_LENGTH / OLLAMA_KEEP_ALIVE del servicio
      # ollama: si difieren, Ollama recarga el modelo entre pedidos. Vacío = no se envía.
      AI_NUM_CTX: ${AI_NUM_CTX:-16384}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:--1}
      AI_NUM_PREDICT: ${AI_NUM_PREDICT:-1024}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-}
      AI_SEED: ${AI_SEED:-}
      AI_NUM_THREAD: ${AI_NUM_THREAD:-}
      AI_THINK: ${AI_THINK:-false}
      AI_WARMUP: ${AI_WARMUP:-true}
      AI_WARMUP_CHECK_SECONDS: ${AI_WARMUP_CHECK_SECONDS:-60}
      AI_PROMPT_MAX_TOKENS: ${AI_PROMPT_MAX_TOKENS:-}
      # Puntaje mínimo de una cita; vacío = sin umbral (se calibra con el feedback real).
      AI_CITATION_MIN_SCORE: ${AI_CITATION_MIN_SCORE:-}
      # Puntaje mínimo para sugerir un control al preclasificar evidencia global; vacío = los 3 mejores.
      AI_CLASSIFY_MIN_SCORE: ${AI_CLASSIFY_MIN_SCORE:-}
      CHROMA_PERSIST_DIR: /data/chroma
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CORE_BACKEND_URL: https://backend-core:8080
      INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      SSL_CERT_FILE: /etc/prisma/tls/ca.crt
      TZ: ${TZ}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--ssl-keyfile", "/etc/prisma/tls/backend-ai.key", "--ssl-certfile", "/etc/prisma/tls/backend-ai.crt"]
    volumes:
      - chroma-data:/data/chroma
      - ./docs/mcu-5.0:/data/knowledge-base:ro
      - ./infra/tls/ca.crt:/etc/prisma/tls/ca.crt:ro
      - ./infra/tls/backend-ai.crt:/etc/prisma/tls/backend-ai.crt:ro
      - ./infra/tls/backend-ai.key:/etc/prisma/tls/backend-ai.key:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/etc/prisma/tls/ca.crt", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: { cpus: '2.0', memory: 4G }

  ollama:
    image: ollama/ollama:0.40.6
    environment:
      # Un solo Ollama por entorno. Modelo cargado de forma permanente y contexto/paralelismo
      # fijos: ver .claude/plans/03 (WP0). La memoria crece con CONTEXT_LENGTH x NUM_PARALLEL.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-64}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.data == true]

  frontend:
    image: ghcr.io/${GHCR_ORG}/prisma-frontend:${TAG}
    volumes:
      - ./infra/tls/ca.crt:/etc/nginx/internal-ca.crt:ro
      - ./infra/nginx/tls/frontend-listen.conf:/etc/nginx/frontend-listen.conf:ro
      - ./infra/tls/frontend.crt:/etc/prisma/tls/frontend.crt:ro
      - ./infra/tls/frontend.key:/etc/prisma/tls/frontend.key:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:8443"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [prisma-net]
    deploy:
      <<: *rolling
      replicas: ${FRONTEND_REPLICAS:-2}
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: { cpus: '0.5', memory: 256M }

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    command:
      - sh
      - -c
      - >-
        install -m 600 -o postgres -g postgres /etc/prisma/tls/server.key.src /var/lib/postgresql/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/etc/prisma/tls/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2 -c hba_file=/etc/prisma/pg_hba.conf
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
      - ./infra/tls/keycloak-db.crt:/etc/prisma/tls/server.crt:ro
      - ./infra/tls/keycloak-db.key:/etc/prisma/tls/server.key.src:ro
      - ./infra/postgres/pg_hba.tls.conf:/etc/prisma/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.data == true]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/tls/ca.crt
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_CACHE: ispn
      KC_CACHE_STACK: jdbc-ping
      JAVA_OPTS_APPEND: -Djgroups.bind.address=match-interface:eth0
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/keycloak.key
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
    volumes:
      - ./infra/tls/keycloak.crt:/opt/keycloak/conf/tls/keycloak.crt:ro
      - ./infra/tls/keycloak.key:/opt/keycloak/conf/tls/keycloak.key:ro
      - ./infra/tls/ca.crt:/opt/keycloak/conf/tls/ca.crt:ro
      - ./infra/keycloak/realm-prisma.json:/opt/keycloak/data/import/realm-prisma.json:ro
      - ./infra/keycloak/themes/prisma:/opt/keycloak/themes/prisma:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 90s
    networks: [prisma-net]
    deploy:
      <<: *rolling
      replicas: ${KEYCLOAK_REPLICAS:-2}
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: { cpus: '1.0', memory: 1G }

  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 105M
      CLAMD_CONF_MaxFileSize: 105M
      CLAMD_CONF_MaxScanSize: 210M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.app == true]

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_TLS_PATH: /etc/prisma/tls
    volumes:
      - rustfs-data:/data
      - ./infra/tls/rustfs.crt:/etc/prisma/tls/rustfs_cert.pem:ro
      - ./infra/tls/rustfs.key:/etc/prisma/tls/rustfs_key.pem:ro
      - ./infra/tls/ca.crt:/etc/prisma/tls/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f --cacert /etc/prisma/tls/ca.crt https://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.data == true]

  nginx:
    image: nginx:1.30-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/tls/ca.crt:/etc/nginx/internal-ca.crt:ro
      - ./infra/nginx/tls/proxy-backend-core.inc:/etc/nginx/conf.d/proxy-backend-core.inc:ro
      - ./infra/nginx/tls/proxy-frontend.inc:/etc/nginx/conf.d/proxy-frontend.inc:ro
      - ./infra/nginx/cloudflare/real-ip.swarm.conf:/etc/nginx/realip/cloudflare.conf:ro
      - nginx-f2b-logs:/var/log/nginx-f2b
      - nginx-banlist:/etc/nginx/banlist:ro
    ports:
      - { target: 80, published: "${NGINX_HTTP_PORT:-80}", protocol: tcp, mode: host }
      - { target: 443, published: "${NGINX_HTTPS_PORT:-443}", protocol: tcp, mode: host }
    networks: [prisma-net]
    deploy:
      <<: *single
      restart_policy:
        condition: any
        delay: 10s
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
      resources:
        limits: { cpus: '1.0', memory: 512M }

  fail2ban:
    image: ghcr.io/${GHCR_ORG}/prisma-fail2ban:${TAG}
    environment:
      F2B_IGNORE_IPS: "${F2B_IGNORE_IPS:-127.0.0.1/8 ::1}"
      NGINX_SWARM_SERVICE: ${STACK:-prisma}_nginx
    volumes:
      - nginx-f2b-logs:/logs
      - nginx-banlist:/banlist
      - fail2ban-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [prisma-net]
    deploy:
      <<: *single
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
