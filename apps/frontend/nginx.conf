# =====================================================================
# nginx.conf del frontend — sirve el SPA de Vue (fallback a index.html) y
# además reexpone /api, /ai y /auth hacia los servicios internos.
# ---------------------------------------------------------------------
# Por qué: el frontend consume VITE_API_BASE_URL/VITE_AI_API_BASE_URL/
# VITE_KEYCLOAK_URL como rutas RELATIVAS ("/api", "/ai/api/v1", "/auth"),
# no orígenes absolutos -- así el navegador nunca sale del origen desde el
# que se sirvió la SPA (mismo esquema, mismo host, mismo puerto: sin CORS,
# sin mixed content). El reverse-proxy principal (infra/nginx/conf.d/
# prisma.conf, HTTPS en :443) ya resuelve esas mismas rutas; estas de acá
# son la MISMA definición para cuando se accede directo a este contenedor
# (p.ej. http://localhost:8080 en dev), así el comportamiento es idéntico
# sin importar por cuál de los dos puertos se entra -- solo cambia si ese
# tramo final está cifrado o no.
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Seguridad de headers ---
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # connect-src/frame-src en 'self': todo el trafico (API, RAG, Keycloak) es same-origin
    # via /api, /ai, /auth -- ya no hace falta whitelistear hosts/puertos externos.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; connect-src 'self'" always;

    # --- Compresión ---
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # --- API Core (backend-core) -- mismo mapeo que infra/nginx/conf.d/prisma.conf ---
    location /api/ {
        proxy_pass         http://backend-core:8080;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, NO $proxy_add_x_forwarded_for: este nginx es el único hop confiable frente
        # a backend-core/backend-ai/Keycloak cuando se entra directo por este puerto (ver el
        # comentario arriba) -- FIJA el header en vez de agregarle el IP real al final de lo que
        # ya venga. Con $proxy_add_x_forwarded_for, un cliente que manda su propio
        # "X-Forwarded-For: 1.2.3.4" queda como primer valor de la lista, y como
        # AuditLogService.currentIp() (backend-core) toma ese header tal cual, terminaba
        # registrando en la bitácora el IP que el cliente eligiera en vez del real (spoofing).
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- API IA / RAG (backend-ai) ---
    location /ai/ {
        proxy_pass         http://backend-ai:8000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, NO $proxy_add_x_forwarded_for -- ver el comentario en location /api/.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- Keycloak (SSO) ---
    location /auth/ {
        # SIN barra final en el destino: a diferencia de /api y /ai, acá se preserva el prefijo
        # /auth tal cual llegó (Keycloak corre con KC_HTTP_RELATIVE_PATH=/auth, así que espera
        # recibir ese prefijo -- ver el servicio "keycloak" en docker-compose.yml).
        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, NO $proxy_add_x_forwarded_for -- ver el comentario en location /api/.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Con hostname dinámico (KC_HOSTNAME sin fijar + KC_PROXY_HEADERS=xforwarded), Keycloak
        # arma cada URL que genera (login, redirects) a partir de ESTE header, no del que reciba
        # directo -- sin esto, cae al Host interno keycloak:8080 y el login vuelve a romperse.
        #
        # $http_host, NO $host: la variable $host de nginx NUNCA incluye el puerto, así que con
        # $host acá el formulario de login de Keycloak terminaba apuntando a
        # "http://localhost/..." (puerto 80 implícito) en vez de "http://localhost:8080/...",
        # y el POST del login fallaba con connection refused en cualquier puerto no estándar
        # (exactamente el http://localhost:8080 que documenta el Quickstart). $http_host sí
        # preserva el puerto cuando el cliente lo mandó en el header Host.
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # --- Cache de assets estáticos ---
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: cualquier ruta no encontrada devuelve index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Prohibir acceso a archivos ocultos y de configuración ---
    location ~ /\. { deny all; return 404; }

    # --- Health endpoint ---
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
}
