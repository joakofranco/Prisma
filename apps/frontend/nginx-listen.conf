# Listener del contenedor frontend. En desarrollo sirve HTTP plano en el 80.
# docker-compose.prod.yml monta infra/nginx/tls/frontend-listen.conf encima de este archivo
# (/etc/nginx/frontend-listen.conf) para servir HTTPS en el 8443 con el certificado de la CA
# interna (PRI-369).
listen 80;
listen [::]:80;
