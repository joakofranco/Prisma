# =====================================================================
# SonarQube — configuración del proyecto PRISMA (monorepo)
# =====================================================================

sonar.projectKey=prisma
sonar.projectName=PRISMA
sonar.projectVersion=0.1.0
sonar.organization=prisma

# ---------- Fuentes ----------
sonar.sources=apps/frontend/src,apps/backend-core/src/main,apps/backend-ai/app
sonar.tests=apps/frontend/tests,apps/backend-core/src/test,apps/backend-ai/tests

sonar.sourceEncoding=UTF-8

# ---------- Exclusiones ----------
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/migrations/**,**/*.mock.ts

# ---------- Cobertura ----------
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=apps/backend-core/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=apps/backend-ai/coverage.xml
sonar.java.binaries=apps/backend-core/target/classes

# ---------- Quality Gate ----------
sonar.qualitygate.wait=true

# ---------- Idioma / duplicación ----------
sonar.cpd.exclusions=**/*.dto.ts,**/*Entity.java
